<script>
        // Simple script to handle swatch selection visual feedback
        document.querySelectorAll('.rounded-full.ring-1').forEach(swatch => {
            swatch.addEventListener('click', (e) => {
                e.stopPropagation(); // Prevent card click
                // Remove active ring offset from siblings
                const siblings = e.target.parentElement.children;
                Array.from(siblings).forEach(sib => {
                    sib.classList.remove('ring-offset-2', 'ring-offset-background');
                });
                // Add to clicked
                e.target.classList.add('ring-offset-2', 'ring-offset-background');
            });
        });
    </script>
