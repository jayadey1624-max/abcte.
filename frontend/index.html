                    <div className="flex items-center gap-3 mb-3">
                      <span className="material-symbols-outlined text-primary">calendar_month</span>
                      <h4 className="font-headline-md text-body-lg text-primary">Client Schedule</h4>
                    </div>
                    <p className="text-caption text-on-surface-variant">Review consultation records and client notes.</p>
                  </div>
                  <div onClick={() => navigateTo('contact')} className="flex-1 bg-surface-container-lowest p-6 rounded-xl border border-outline-variant/50 hover:border-primary/40 cursor-pointer">
                    <div className="flex items-center gap-3 mb-3">
                      <span className="material-symbols-outlined text-primary">forum</span>
                      <h4 className="font-headline-md text-body-lg text-primary">Inquiry Inbox</h4>
                    </div>
                    <p className="text-caption text-on-surface-variant">Direct messages from interior designers.</p>
                  </div>
                </div>
              </section>
            </div>
          </div>

          {/* Add Product Modal */}
          {showModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
              <div className="bg-surface-container-lowest max-w-lg w-full p-8 rounded-2xl border border-outline-variant/40 shadow-2xl space-y-5">
                <div className="flex justify-between items-center">
                  <h3 className="font-display-lg text-headline-md text-primary">Add New Textile</h3>
                  <button onClick={() => setShowModal(false)}><span className="material-symbols-outlined">close</span></button>
                </div>
                <form onSubmit={handleAdd} className="space-y-4">
                  <div>
                    <label className="block text-xs uppercase tracking-wider text-on-surface-variant mb-1">Textile Name</label>
                    <input required type="text" value={name} onChange={e => setName(e.target.value)} placeholder="Imperial Silk Damask" className="w-full bg-surface-container p-2.5 rounded text-sm outline-none" />
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs uppercase tracking-wider text-on-surface-variant mb-1">Category</label>
                      <select value={cat} onChange={e => setCat(e.target.value)} className="w-full bg-surface-container p-2.5 rounded text-sm outline-none">
                        <option value="Linen">Linen</option>
                        <option value="Silk">Silk</option>
                        <option value="Cotton">Cotton</option>
                        <option value="Wool">Wool</option>
                        <option value="Synthetic">Synthetic</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs uppercase tracking-wider text-on-surface-variant mb-1">Spec (GSM / Thread)</label>
                      <input type="text" value={spec} onChange={e => setSpec(e.target.value)} className="w-full bg-surface-container p-2.5 rounded text-sm outline-none" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs uppercase tracking-wider text-on-surface-variant mb-1">Price Per Yard ($)</label>
                    <input type="number" value={price} onChange={e => setPrice(Number(e.target.value))} className="w-full bg-surface-container p-2.5 rounded text-sm outline-none" />
                  </div>
                  <div className="flex justify-end gap-3 pt-4 border-t border-outline-variant/30">
                    <button type="button" onClick={() => setShowModal(false)} className="px-4 py-2 text-xs uppercase font-label-md">Cancel</button>
                    <button type="submit" className="bg-primary text-on-primary px-6 py-2 rounded text-xs uppercase font-label-md">Save</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- PAGE 8: ADMIN MEETING HISTORY ---
    function AdminMeetingsView({ meetings, navigateTo }) {
      const [filter, setFilter] = useState('All');
      const [q, setQ] = useState('');
      const [selectedMeeting, setSelectedMeeting] = useState(null);

      const filtered = meetings.filter(m => {
        const matchF = filter === 'All' || m.status.toLowerCase() === filter.toLowerCase();
        const matchQ = m.clientName.toLowerCase().includes(q.toLowerCase()) || m.company.toLowerCase().includes(q.toLowerCase());
        return matchF && matchQ;
      });

      return (
        <div className="min-h-screen flex bg-background">
          <aside className="w-64 border-r border-outline-variant/30 bg-surface-container-low hidden md:flex flex-col justify-between p-6 fixed h-full z-30">
            <div className="space-y-8">
              <div onClick={() => navigateTo('home')} className="flex items-center gap-2 cursor-pointer">
                <span className="material-symbols-outlined text-2xl text-primary">grain</span>
                <span className="font-display-lg text-lg text-primary font-bold">ABC Textiles</span>
              </div>
              <nav className="space-y-1">
                <button onClick={() => navigateTo('admin')} className="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-label-md text-on-surface-variant hover:text-primary">
                  <span className="material-symbols-outlined text-xl">dashboard</span> Dashboard
                </button>
                <button className="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-label-md font-semibold bg-surface-container text-primary border-l-4 border-primary">
                  <span className="material-symbols-outlined text-xl">event_available</span> Consultations
                </button>
                <button onClick={() => navigateTo('catalogue')} className="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-label-md text-on-surface-variant hover:text-primary">
                  <span className="material-symbols-outlined text-xl">layers</span> Fabric Archive
                </button>
              </nav>
            </div>
            <div className="pt-6 border-t border-outline-variant/30">
              <button onClick={() => navigateTo('home')} className="flex items-center gap-2 text-xs uppercase text-on-surface-variant hover:text-primary">
                <span className="material-symbols-outlined text-sm">arrow_back</span> Client Site
              </button>
            </div>
          </aside>

          <div className="flex-1 md:ml-64 flex flex-col min-h-screen">
            <header className="h-16 bg-surface/85 backdrop-blur-md sticky top-0 z-20 border-b border-outline-variant/30 flex items-center justify-between px-6">
              <div className="flex items-center gap-3">
                <button onClick={() => navigateTo('admin')} className="md:hidden text-primary">
                  <span className="material-symbols-outlined">arrow_back</span>
                </button>
                <h1 className="font-headline-md text-lg text-primary font-medium">Showroom Consultations</h1>
              </div>
            </header>

            <div className="p-6 md:p-10 max-w-container-max w-full mx-auto space-y-8">
              <div className="flex flex-col md:flex-row justify-between items-start md:items-end gap-6 pb-4 border-b border-outline-variant/30">
                <div>
                  <h2 className="font-display-lg text-headline-lg-mobile md:text-headline-lg text-primary">Meeting History</h2>
                  <p className="text-sm text-on-surface-variant mt-1">Review and manage past and upcoming client consultations.</p>
                </div>
                <div className="relative w-full md:w-80">
                  <input
                    type="text"
                    value={q}
                    onChange={e => setQ(e.target.value)}
                    placeholder="Search clients or companies..."
                    className="w-full bg-transparent border-b border-outline-variant pb-2 text-sm outline-none focus:border-primary pr-8"
                  />
                  <span className="material-symbols-outlined absolute right-0 bottom-2 text-outline">search</span>
                </div>
              </div>

              {/* Filter tabs */}
              <div className="flex gap-3 overflow-x-auto pb-2 no-scrollbar">
                {['All', 'Upcoming', 'Completed', 'Cancelled'].map(tab => (
                  <button
                    key={tab}
                    onClick={() => setFilter(tab)}
                    className={`rounded-full px-5 py-2 text-xs uppercase tracking-wider font-label-md transition-colors ${filter === tab
                      ? 'bg-primary text-on-primary border border-primary'
                      : 'border border-outline-variant text-on-surface-variant bg-surface-container-lowest'
                      }`}
                  >
                    {tab}
                  </button>
                ))}
              </div>

              {/* List */}
              <div className="flex flex-col border-t border-outline-variant">
                {filtered.map(item => (
                  <div
                    key={item.id}
                    onClick={() => setSelectedMeeting(item)}
                    className="border-b border-outline-variant py-6 px-4 hover:bg-surface-container-low transition-colors cursor-pointer rounded-lg"
                  >
                    <div className="grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
                      <div className="md:col-span-5">
                        <p className="font-body-lg text-primary font-medium">{item.clientName}</p>
                        <p className="text-caption text-on-surface-variant uppercase tracking-wider">{item.company}</p>
                      </div>
                      <div className="md:col-span-4 flex flex-col gap-1 text-sm text-on-surface-variant">
                        <span className="flex items-center gap-1.5"><span className="material-symbols-outlined text-sm">calendar_today</span> {item.date}</span>
                        <span className="flex items-center gap-1.5"><span className="material-symbols-outlined text-sm">schedule</span> {item.time}</span>
                      </div>
                      <div className="md:col-span-2">
                        <span className={`inline-block px-3 py-1 rounded-full text-xs uppercase tracking-wider font-semibold ${item.statusBadgeColor}`}>
                          {item.status}
                        </span>
                      </div>
                      <div className="hidden md:flex md:col-span-1 justify-end">
                        <span className="material-symbols-outlined text-outline-variant">arrow_forward</span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* Meeting Detail Modal */}
          {selectedMeeting && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
              <div className="bg-surface-container-lowest max-w-lg w-full p-8 rounded-2xl border border-outline-variant/40 shadow-2xl space-y-6">
                <div className="flex justify-between items-start">
                  <div>
                    <span className={`inline-block px-3 py-0.5 rounded-full text-xs uppercase font-semibold mb-2 ${selectedMeeting.statusBadgeColor}`}>
                      {selectedMeeting.status}
                    </span>
                    <h3 className="font-display-lg text-headline-md text-primary">{selectedMeeting.clientName}</h3>
                    <p className="text-xs uppercase text-on-surface-variant font-label-md">{selectedMeeting.company}</p>
                  </div>
                  <button onClick={() => setSelectedMeeting(null)}><span className="material-symbols-outlined">close</span></button>
                </div>
                <div className="space-y-3 border-y border-outline-variant/30 py-4 text-sm text-on-surface-variant">
                  <div className="flex justify-between"><span>Date:</span><strong className="text-primary">{selectedMeeting.date} ({selectedMeeting.time})</strong></div>
                  <div className="flex justify-between"><span>Email:</span><strong className="text-primary">{selectedMeeting.email}</strong></div>
                  <div className="mt-2">
                    <span className="block text-xs uppercase font-bold text-primary mb-1">Notes:</span>
                    <p className="bg-surface-container p-3 rounded text-xs text-on-surface">{selectedMeeting.notes}</p>
                  </div>
                </div>
                <div className="flex justify-end">
                  <button onClick={() => setSelectedMeeting(null)} className="bg-primary text-on-primary px-6 py-2.5 rounded text-xs uppercase font-label-md">Close</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- FABRIC DETAIL MODAL ---
    function FabricModal({ fabric, onClose, onAddSample, navigateTo }) {
      if (!fabric) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
          <div className="bg-surface-container-lowest max-w-3xl w-full rounded-2xl overflow-hidden shadow-2xl border border-outline-variant/40 relative flex flex-col md:flex-row max-h-[90vh] overflow-y-auto">
            <button onClick={onClose} className="absolute top-4 right-4 z-10 w-9 h-9 rounded-full bg-surface/80 flex items-center justify-center text-primary">
              <span className="material-symbols-outlined">close</span>
            </button>
            <div className="md:w-1/2 aspect-square md:aspect-auto bg-surface-container">
              <img src={fabric.image} alt={fabric.name} className="w-full h-full object-cover" />
            </div>
            <div className="md:w-1/2 p-8 flex flex-col justify-between space-y-6">
              <div>
                <span className="text-xs uppercase tracking-wider text-on-surface-variant bg-surface-container-high px-2 py-0.5 rounded">{fabric.category}</span>
                <h2 className="font-display-lg text-headline-md text-primary mt-2">{fabric.name}</h2>
                <p className="text-lg font-bold text-primary mt-1">${fabric.pricePerYard} <span className="text-sm font-normal text-on-surface-variant">/ linear yard</span></p>
                <p className="text-sm text-on-surface-variant leading-relaxed mt-4">{fabric.description}</p>
                <div className="border-t border-b border-outline-variant/30 py-3 mt-4 space-y-1.5 text-xs text-on-surface-variant">
                  <div className="flex justify-between"><span>Composition:</span><span className="text-primary font-medium">{fabric.composition}</span></div>
                  <div className="flex justify-between"><span>Width:</span><span className="text-primary font-medium">{fabric.width}</span></div>
                  <div className="flex justify-between"><span>Weight:</span><span className="text-primary font-medium">{fabric.spec}</span></div>
                </div>
              </div>
              <div className="space-y-3">
                <button
                  onClick={() => { onAddSample(fabric); onClose(); }}
                  className="w-full bg-primary text-on-primary py-3.5 rounded text-xs uppercase tracking-wider font-label-md flex items-center justify-center gap-2"
                >
                  <span className="material-symbols-outlined text-sm">shopping_bag</span> Order Swatch Sample
                </button>
                <button
                  onClick={() => { onClose(); navigateTo('showroom'); }}
                  className="w-full border border-outline text-primary py-3 rounded text-xs uppercase tracking-wider font-label-md hover:border-primary"
                >
                  Book Showroom Viewing
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
